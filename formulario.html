<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/estilo.css">
        <title>Formulario</title>
    </head>
    <body>
        <header>
            <h1>Esta es mi primera WEB</h1>
            <nav>
                <a href="index.html"> Inicio</a>
                <a href="horario.html"> Horario</a>
            </nav>
        </header>
        <main>
            <h2>Formulario de Contacto</h2>
            <form>
                <fieldset>
                    <legend>Datos de contacto</legend>
                    <p>
                        <!--Nombre-->
                        <label for="nombre">Nombre</label>
                        <input type="text" name="nombre" id="nombre"
                            placeholder="Escribe tu nombre" required />
                    </p>
                    <p>
                        <!--Apellido-->
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido"
                            placeholder="Escribe tu apellido" required />
                    </p>
                    <p>
                        <!--Contraseña-->
                        <label for="contrasena">Contraseña</label>
                        <input type="password" name="contrasena" id="contrasena"
                            placeholder="Escribe tu contraseña" required />
                    </p>
                    <p>
                        <!--Correo-->
                        <label for="correo">Correo electrónico</label>
                        <input type="email" name="correo" id="correo"
                            placeholder="Escribe tu correo" required />
                    </p>
                    <p>
                        <!--Teléfono-->
                        <label for="telefono">Teléfono</label>
                        <input type="tel" name="telefono" id="telefono"
                            placeholder="Escribe tu teléfono" required />
                    </p>
                    <p>
                        <!--Pagina web-->
                        <label for="web">Sitio web</label>
                        <input type="url" name="web" id="web"
                            placeholder="Escribe la URL de tu sitio web" />
                    </p>
                    <p>
                        <!--Buscar-->
                        <label for="buscar">Buscar</label>
                        <input type="search" name="buscar" id="buscar" />
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Fechas y horas</legend>
                    <!--Fecha-->
                    <p>
                        <label for="fecha">Fecha:</label>
                        <input type="date" name="fecha" id="fecha">
                    </p>
                    <!--Hora-->
                    <p>
                        <label for="hora">Hora:</label>
                        <input type="time" name="hora" id="hora">
                    </p>
                    <!--Fecha y hora-->
                    <p>
                        <label for="fechaHora">Fecha y hora:</label>
                        <input type="datetime-local" name="fechaHora"
                            id="fechaHora">
                    </p>
                    <!--Mes-->
                    <p>
                        <label for="mes">Mes:</label>
                        <input type="month" name="mes" id="mes">
                    </p>
                    <!--Semana-->
                    <p>
                        <label for="semana">Semana:</label>
                        <input type="week" name="semana" id="semana">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Valores numericos</legend>
                    <!--Edad-->
                    <p>
                        <label for="edad">Edad:</label>
                        <input type="number" name="edad" id="edad" min="0"
                            max="120" step="1">
                    </p>
                    <!--Rango-->
                    <p>
                        <label for="valor">Nivel:</label>
                        <input type="range" name="valor" id="valor" min="0"
                            max="100">
                    </p>
                    <!--Color-->
                    <p>
                        <label for="color">Color favorito</label>
                        <input type="color" name="color" id="color">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Opciones</legend>
                    <!--Radio-->
                    <p>Selecciona una opcion:</p>
                    <input type="radio" name="opcion" id="opcion1" value="1">
                    <label for="opcion1">Opcion 1</label>
                    <br />
                    <input type="radio" name="opcion" id="opcion2" value="2">
                    <label for="opcion2">Opcion 2</label>
                    <br/>
                    <input type="radio" name="opcion" id="opcion3" value="3">
                    <label for="opcion3">Opcion 3</label>
                    <!--Checbox-->
                    <p>Selecciona tus aficiones</p>
                    <input type="checkbox" name="aficiones" id="deporte" value="deporte">
                    <label for="deporte">Deporte</label>
                    <br>
                    <input type="checkbox" name="aficiones" id="musica" value="musica">
                    <label for="muscia">Musica</label>
                    <br>
                    <input type="checkbox" name="aficiones" id="informatica" value="informatica">
                    <label for="informatica">Informatica</label>
                </fieldset>

                <fieldset>
                    <legend>Listas</legend>
                    <!--Select-->
                    <p>
                        <label for="provincia">Provincia:</label>
                        <select name="provincia" id="provincia">
                            <option value="">Selecciona una provincia</option>
                            <option value="cordoba">Cordoba</option>
                            <option value="ciudad_real">Ciudad Real</option>
                            <option value="toledo">Toledo</option>
                            <option value="jaen">Jaen</option>
                        </select>
                    </p>
                    <!--Select con grupos-->
                    <p>
                        <label for="estudio">Estudios</label>
                        <select name="estudio" id="estudios">
                            <optgroup label="Informatica">
                                <option value="dam">DAM</option>
                                <option value="daw">DAW</option>
                                <option value="asir">ASIR</option>
                            </optgroup>

                            <optgroup label="Electronica">
                                <option value="teleco">Sistemas de Telecomunicacion</option>
                                <option value="electronica">Electronica</option>
                            </optgroup>
                        </select>
                    </p>
                    <!--Select Multiple-->
                    <p>
                        <label for="lenguajes">Lenguajes favoritos:</label>

                        <select name="lenguajes" id="lenguajes" multiple size="4">
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="javascript">JavaScript</option>
                            <option value="java">Java</option>
                        </select>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Texto</legend>
                    <!--Texto-->
                    <p>
                        <label for="comentario">Comentarios:</label>
                        <br>
                        <textarea name="comentario" id="comentarios" rows="5" cols="40" placeholder="Escribre aqui"></textarea>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Otros elementos</legend>
                    <!--File-->
                    <p>
                        <label for="archivo">Selecciona un archivo:</label>
                        <input type="file" name="archivo" id="archivo">
                    </p>
                    <!--Datalist-->
                    <p>
                        <label for="navegador">Navegador favorito:</label>
                        <input type="navegadores" name="navegador" id="navegador">
                        <datalist id="navegadores">
                            <option value="Chrome"></option>
                            <option value="Firefox"></option>
                            <option value="Edge"></option>
                            <option value="Brave"></option>
                        </datalist>
                    </p>
                    <!--Hidden-->
                    <input type="hidden" name="id_ususario" value="123">
                </fieldset>

                <fieldset>
                    <legend>Botones</legend>
                    <!--Submit-->
                    <input type="submit" value="Enviar formulario">
                </fieldset>
            </form>
        </main>
        <!-- PIE DE PAGIAN-->
        <footer>
            <p>CIFP Virgen de Gracia</p>
            <p>
                Contacto:
                <a href="email">correodeprueba@gmail.com</a>
            </p>
        </footer>
    </body>
</html>
