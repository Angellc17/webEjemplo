<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cambio de Nombre</title>
    </head>
    <header></header>
    <body>
        <form action="pagina5.html">
            <h1>Bienvenido al formulario de cambio de nombre</h1>
            <p>¿Te gusta tu nombre?(elige solo una opción)</p>
            <input type="radio" id="opcion1" name="opcion" value="1">
            <label for="opcion1">Si</label>
            <input type="radio" id="opcion2" name="opcion" value="2">
            <label for="opcion2">No</label>
            <input type="radio" id="opcion3" name="opcion" value="3">
            <label for="opcion3">Nunca lo he pensado</label>

            <div style="display: flex; align-items: center; gap: 10px;">
                <p>Selecciona el nombre que te quieres poner:</p>
                <select id="nombre" name="nombre">
                    <option value>Selecciona un nombre</option>
                    <option value="Marco">Marco</option>
                    <option value="Julio">Julio</option>
                    <option value="Jaime">Jaime</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div style="display: flex; align-items: center; gap: 10px;">
                <p>En caso de querer otro nombre, escríbelo aqui:</p>
                <input type="text" id="nombre" name="nombre"
                    placeholder="Nombre">
            </div>
            <div>
                <p style="margin-bottom: 5px;">Valora tu experiencia</p>
                <input type="range" id="nivel" name="nivel" min="0" max="100"
                    list="marcas">

                <datalist id="marcas">
                    <option value="0"></option>
                    <option value="10"></option>
                    <option value="20"></option>
                    <option value="30"></option>
                    <option value="40"></option>
                    <option value="50"></option>
                    <option value="60"></option>
                    <option value="70"></option>
                    <option value="80"></option>
                    <option value="90"></option>
                    <option value="100"></option>
                </datalist>
            </div>
            <div style="margin-top: 15px;">
                <input type="submit" value="Enviar">
                <input type="reset" value="Restablecer">
            </div>
        </body>
    </form>
    <footer></footer>
</html>
