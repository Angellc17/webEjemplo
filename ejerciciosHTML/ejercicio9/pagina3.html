<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Usuario</title>
        <link rel="stylesheet" href="css/estilo_pag3.css">
    </head>
    <header></header>
    <body>
        <main>
            <form action="pagina4.html">
                <fieldset class="formulario">
                    <legend>Datos del usuario</legend>
                    <!--Nombre-->
                    <label for="nombre">Nombre*:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required />
                    <br>
                    <!--Apellidos-->
                    <label for="apellidos">Apellidos*:</label>
                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required />
                    <br>
                    <!--Fechas nacimiento-->
                    <label for="fecha">Fecha de nacimiento*:</label>
                    <input
                        type="date"
                        id="fecha"
                        name="fecha"
                        required />
                    <br>
                    <!--Mail-->
                    <label for="email">Email*:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required />
                    <br>
                    <!--Contraseña-->
                    <label for="password">Contraseña*:</label>
                    <input
                        type="password"
                        id="paswword"
                        name="password"
                        required />    
                </fieldset>
                <fieldset class="botones">
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Restablecer">
                </fieldset>
            </form>
        </main>

    </body>
    <footer></footer>
</html>
