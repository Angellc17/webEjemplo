<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" dontent="widtd=device-widtd, initial-scale=1.0">
        <title>Document</title>
        <script src="js/script.js"></script>
        <link rel="stylesheet" href="css_js/estilo_ejemplo.css">
    </head>
    <body>
        <head>
            <h1>Bienvenido a mi pagina web</h1>
        </head>
        <main>
            <h1>Hola,mundo</h1>
            <p>Este es un ejemplo de documento HTML</p>
            <button onclick="sumar()">Sumar</button>
            <button class="btn_resta" onclick="restar()">Restar</button>
            <button onclick="dividir()">Division</button>
            <button onclick="multiplicar()">Multiplicacion</button>

            <table>
                <div class="calculadora">
                    <input type="text" id="mostrar" readonly>
                </div>
                <thead>
                    <tr>
                        <td><button class="btn_num">1</button></td>
                        <td><button class="btn_num">2</button></td>
                        <td><button class="btn_num">3</button></td>
                        <td><button class="btn_num"><-</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn_num">4</button></td>
                        <td><button class="btn_num">5</button></td>
                        <td><button class="btn_num">6</button></td>
                        <td><button class="btn_num">+</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn_num">7</button></td>
                        <td><button class="btn_num">8</button></td>
                        <td><button class="btn_num">9</button></td>
                        <td><button class="btn_num">-</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn_num">/</button></td>
                        <td><button class="btn_num">0</button></td>
                        <td><button class="btn_num">*</button></td>
                        <td><button class="btn_num">=</button></td>
                    </tr>
                </thead>
            </table>
        </main>

        <footer>
            <p>2024 Mi pagina web</p>
        </footer>
    </body>
</html>
