<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Piedra, papel o tijera</title>
        <script src="js/juego.js" defer></script>
    </head>
    <body>
        <main>
            <h1>Piedra, papel o tijera</h1>
            <p>Elige una opción y juega contra la máquina.</p>
            <input type="text" id="pantalla" readonly>
            <div>
                <button onclick="piedraPapelTijera('piedra')">Piedra</button>
                <button onclick="piedraPapelTijera('papel')">Papel</button>
                <button onclick="piedraPapelTijera('tijera')">Tijera</button>
            </div>
            <p id="jugada-jugador">Tu elección: -</p>
            <p id="jugada-maquina">Elección de la máquina: -</p>
            <p id="partidas">Partidas jugadas: 0</p>
            <p id="ganadas">Partidas ganadas: 0</p>
            <p id="empatadas">Partidas empatadas: 0</p>
            <p id="perdidas">Partidas perdidas: 0</p>
        </main>
    </body>
</html>
